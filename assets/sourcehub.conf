# SourceHub System-Wide Configuration
# This file is read by /usr/bin/sourcehub if present.
# Users can override settings in ~/.config/sourcehub/sourcehub.conf

# Network interface to bind the HTTP server to (default: 127.0.0.1)
# Use 0.0.0.0 to allow LAN access
HOST="127.0.0.1"

# Port to listen on (default: 5173)
PORT="5173"

# Root directory containing git repositories (default: $HOME/Dev)
# SOURCEHUB_REPOS_DIR="${HOME}/Dev"

# Directory for SQLite database, logs, and agent worktrees (default: $HOME/.sourcehub)
# SOURCEHUB_DATA_DIR="${HOME}/.sourcehub"

# Node.js binary path (leave empty to use system 'node')
# NODE_BIN="/usr/bin/node"
