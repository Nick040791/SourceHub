name: materialize-v012-deb
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode deb, commit, cleanup staging artifacts
        run: |
          set -euo pipefail
          test -f releases/sourcehub_0.1.2_amd64.deb.b64
          base64 -d releases/sourcehub_0.1.2_amd64.deb.b64 > releases/sourcehub_0.1.2_amd64.deb
          echo "89ba276d4323a88fe8ef40d4780709ec36d41ae06605da7404834c6de6b2d155  releases/sourcehub_0.1.2_amd64.deb" | sha256sum -c -
          rm -f releases/sourcehub_0.1.2_amd64.deb.b64
          rm -f .github/workflows/materialize-v012-deb.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A releases/sourcehub_0.1.2_amd64.deb releases/sourcehub_0.1.2_amd64.deb.b64 .github/workflows/materialize-v012-deb.yml
          git status
          git commit -m "release(v0.1.2): materialize deb binary (Style D S-in-hex icon)"
          git push
