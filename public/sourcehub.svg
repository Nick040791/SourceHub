<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="14" y="14" width="228" height="228" rx="50" fill="url(#bg)" stroke="#30363d" stroke-width="6"/>

  <!-- Glowing forge / branch paths -->
  <g filter="url(#glow)">
    <!-- Main stem -->
    <path d="M 80,68 L 80,188" stroke="#58a6ff" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Branch curve -->
    <path d="M 80,132 C 120,132 176,120 176,84 L 176,68" stroke="#bc8cff" stroke-width="14" fill="none" stroke-linecap="round"/>
    
    <!-- Merge curve back -->
    <path d="M 176,140 C 176,168 120,188 80,188" stroke="#3fb950" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.7"/>

    <!-- Nodes -->
    <circle cx="80" cy="68" r="16" fill="#161b22" stroke="#58a6ff" stroke-width="8"/>
    <circle cx="80" cy="188" r="16" fill="#161b22" stroke="#3fb950" stroke-width="8"/>
    <circle cx="176" cy="68" r="16" fill="#161b22" stroke="#bc8cff" stroke-width="8"/>
  </g>

  <!-- Sparkle / Helper Star -->
  <path d="M 188,172 Q 188,188 204,188 Q 188,188 188,204 Q 188,188 172,188 Q 188,188 188,172 Z" fill="#d2a8ff"/>
</svg>
